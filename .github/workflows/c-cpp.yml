name: Anodyne C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: build code
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev cmake
        cd src
        mkdir build
        cd build
        cmake ..
        make -j2
